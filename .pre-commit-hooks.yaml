- id: secret-me
  name: SecretMe - secret, token and password leak detection
  description: Scans the staged changes for secrets (gitleaks, with org rules)
  entry: secret-me scan --staged
  language: node
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
