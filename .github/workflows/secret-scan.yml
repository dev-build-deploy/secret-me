---

name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  secret-me:
    name: No secrets (secret-me scans itself)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          token: ${{ github.token }}
          sarif-file: secret-me.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('secret-me.sarif') != ''
        with:
          sarif_file: secret-me.sarif
          category: secret-me
        continue-on-error: true  # code scanning may be unavailable (private repository, forks)
